[package]
name = "rhp-vm"
version = "0.1.0"
edition = "2021"
description = "Maquina virtual baseada em pilha para o RHP (Fase 1)"
license = "MIT OR Apache-2.0"

[dependencies]
rhp-bytecode = { path = "../rhp-bytecode" }
rhp-parser = { path = "../rhp-parser" }
# TLS (ADR 0012): rustls puro + raizes embutidas; ring via cc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
