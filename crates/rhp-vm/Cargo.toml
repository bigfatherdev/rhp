[package]
name = "rhp-vm"
version = "0.2.0"
edition = "2021"
description = "Maquina virtual baseada em pilha para o RHP (Fase 1)"
license = "MIT OR Apache-2.0"

[dependencies]
rhp-bytecode = { path = "../rhp-bytecode" }
rhp-parser = { path = "../rhp-parser" }
# Hashing de senhas (ADR 0013): Argon2id (novos hashes) + bcrypt (verifica
# $2a$/$2b$/$2x$/$2y$, ex.: bancos PHP legados). Puros Rust, sem C.
argon2 = "0.6"
bcrypt = "0.19"
password-hash = "0.6"
# Regex + hashing geral (ADR 0014): `regex` (tempo linear garantido),
# `sha2` + `hmac` (RustCrypto, puros Rust, sem C).
regex = "1"
sha2 = "0.11"
hmac = "0.13"
# TLS (ADR 0012): rustls puro + raizes embutidas; ring via cc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
