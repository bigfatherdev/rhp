[package]
name = "rhp-cli"
version = "0.1.0"
edition = "2021"
description = "CLI oficial do RHP (binario rhp) - Fase 1"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rhp"
path = "src/main.rs"

[dependencies]
rhp-lexer = { path = "../rhp-lexer" }
rhp-parser = { path = "../rhp-parser" }
rhp-bytecode = { path = "../rhp-bytecode" }
rhp-vm = { path = "../rhp-vm" }
rhp-fmt = { path = "../rhp-fmt" }
